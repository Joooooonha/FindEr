spring.application.name=FindEr

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# E-Gen API
egen.api.key=${EGEN_API_KEY:}
egen.api.base-url=http://apis.data.go.kr/B552657/ErmctInfoInqireService

# 실시간 병상정보 API (safetydata.go.kr)
bed.api.key=${BED_API_KEY:}
bed.api.base-url=https://www.safetydata.go.kr/V2/api/DSSP-IF-00242
bed.api.refresh-interval-ms=180000
bed.api.stale-threshold-minutes=30

# 응급실/중증질환 차단메시지 갱신 주기
block.message.refresh-interval-ms=300000

# 중증질환 시술 가능 정보 갱신 주기 (변경 빈도 매우 낮아 1시간 주기)
severe.possibility.refresh-interval-ms=3600000
# 콜드 스타트로 캐시가 비어있을 때만 적용되는 짧은 재시도 주기 (적재되면 점검 후 즉시 종료)
severe.possibility.cold-retry-interval-ms=60000

# 응급의료기관 기본정보 캐시 갱신 주기 (좌표·연락처는 거의 변하지 않음 - 24시간)
hospital.info.refresh-interval-ms=86400000
